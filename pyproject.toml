[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sre-bench"
version = "0.1.0"
description = "SREBench – Production Incident Response OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "gradio>=4.28.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.openenv]
app = "server.app:app"
port = 7860
